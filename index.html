async function lookupRoute(a,force){

   if(!res.ok)throw Error("Plan service HTTP "+res.status);

   entry.info=j;
   entry.status=((j.filed&&j.filed.length>1)||(hasA(j.origin)||hasA(j.destination))||(j.actual&&j.actual.length>1))?"ok":"none";
  }catch(e){entry.status="error";entry.error=String(e)}

function gcLine(o,d){
 const line=[],segments=60,radian=Math.PI/180,p1=o[0]*radian,l1=o[1]*radian,p2=d[0]*radian,l2=d[1]*radian;

 if(!angle)return[o,d];
 for(let i=0;i<=segments;i++){
  const t=i/segments,A=Math.sin((1-t)*angle)/Math.sin(angle),B=Math.sin(t*angle)/Math.sin(angle);
  const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2),y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2),z=A*Math.sin(p1)+B*Math.sin(p2);
  let lon=Math.atan2(y,x)/radian;if(line.length)lon+=Math.round((line[line.length-1][1]-lon)/360)*360;
  line.push([Math.atan2(z,Math.hypot(x,y))/radian,lon]);

}

let lastErr="";
async function loadInner(){const errs=[],generation=trafficGeneration,center=trafficCenter();
 const list=(cfg.relay?[{n:"relay",u:(a,b,r)=>cfg.relay.replace(/\/+$/,"")+`?lat=${a}&lon=${b}&r=${r}`}]:[]).concat(SOURCES);
 for(let i=0;i<list.length;i++){
  const s=list[(src+i)%list.length];
  if(s.min&&Date.now()-(s.last||0)<s.min){errs.push(s.n+" throttled");continue}
  try{
   s.last=Date.now();const r=await fetch(s.u(center.lat.toFixed(3),center.lon.toFixed(3),50),{signal:AbortSignal.timeout(12000)});
   if(!r.ok){let detail="";try{const e=await r.json();detail=(e.error||"")+(e.attempts?" ("+e.attempts.map(x=>x.provider+":"+x.status).join(", ")+")":"")}catch(_){}throw new Error("HTTP "+r.status+(detail?" — "+detail:""))}
   const j=await r.json();
   const incoming=s.p?s.p(j):(j.ac||j.aircraft);
   if(!Array.isArray(incoming))throw Error("Unexpected aircraft data format");
   if(generation!==trafficGeneration)return;
   data=incoming.filter(a=>a.lat!=null&&a.lon!=null);
   if(remoteAircraft&&Date.now()-remoteFoundAt<90000&&!data.some(a=>a.hex===remoteAircraft.hex))data.push(remoteAircraft);
   src=(src+i)%list.length;
   data.forEach(a=>{const t=trails[a.hex]=trails[a.hex]||[],l=t[t.length-1];if(!l||l[0]!=a.lat||l[1]!=a.lon){t.push([a.lat,a.lon]);if(t.length>80)t.shift()}});
   $("sA").className="ok";$("sA").textContent=`Receiving (${s.n})`;
   return draw();
  }catch(e){console.warn(s.n,e);errs.push(s.n+": "+(e.message||e))}
 }
 $("sA").className="bad";$("sA").textContent="No data — "+errs.join(" • ").slice(0,210);
 console.warn("Aircraft sources unavailable",errs);
}
async function updateFollowedAircraft(){
 // Keep a followed aircraft, or one found by search from far away, updating even when it is outside the local feed.
 if(!sel||!/^[0-9a-f]{6}$/i.test(sel))return;
 if(!follow&&!(remoteAircraft&&remoteAircraft.hex===sel))return;
 try{
  const res=await fetch("/api/search?query="+encodeURIComponent(sel),{signal:AbortSignal.timeout(8500),cache:"no-store"});
  if(!res.ok)return;
  const payload=await res.json();
  const a=(payload.ac||[]).find(x=>x.hex?.toLowerCase()===sel.toLowerCase()&&x.lat!=null&&x.lon!=null);
  if(!a)return;
  const old=data.find(x=>x.hex===sel);
  if(old&&old.lat===a.lat&&old.lon===a.lon)return;
  remoteAircraft=a;remoteFoundAt=Date.now();
  data=data.filter(x=>x.hex!==a.hex).concat(a);
  const t=trails[a.hex]||(trails[a.hex]=[]);
  if(!t.length||t[t.length-1][0]!==a.lat||t[t.length-1][1]!==a.lon){t.push([a.lat,a.lon]);if(t.length>100)t.shift()}

}

// Smooth predicted movement from ADS-B groundspeed and track.
// Positions between actual feed reports are estimates, not confirmed locations.
const motion=new Map();
const maxPredictionSeconds=14;
let lastFrame=0;
function projectPosition(lat,lon,speed,heading,seconds){
 const nm=(Math.max(0,Number(speed)||0)*seconds)/3600;
 const bearing=(Number(heading)||0)*Math.PI/180,lat2=lat+nm*Math.cos(bearing)/60;
 const cos=Math.max(.05,Math.cos(lat*Math.PI/180));
 return [lat2,lon+nm*Math.sin(bearing)/(60*cos)];
}
function animateAircraft(now){
 if(now-lastFrame>32){lastFrame=now;
  for(const [hex,m] of motion){
   const marker=mk[hex];if(!marker){motion.delete(hex);continue}
   const elapsed=Math.max(0,(now-m.time)/1000);
   const forward=Math.min(elapsed,maxPredictionSeconds);
   const predicted=projectPosition(m.report.lat,m.report.lon,m.report.gs,m.report.track,forward);
   const correction=Math.min(1,elapsed/2);
   const lat=m.previous[0]*(1-correction)+predicted[0]*correction;
   const lon=m.previous[1]*(1-correction)+predicted[1]*correction;
   marker.setLatLng([lat,lon]);
   if(follow&&sel===hex)map.panTo([lat,lon],{animate:false});
  }
 }
 requestAnimationFrame(animateAircraft);
}
requestAnimationFrame(animateAircraft);

 });

async function lookupFlight(){

 if(!/^[A-Z0-9-]{3,12}$/.test(query)){searchError="Enter a valid callsign, registration or ICAO hex (3–12 characters).";updateSearchStatus();return}
 searchBusy=true;searchError="";updateSearchStatus();
 try{
  let matches=[],source="",resolved="";
  for(const candidate of queries){
   const response=await fetch("/api/search?query="+encodeURIComponent(candidate),{signal:AbortSignal.timeout(12000),cache:"no-store"});
   const payload=await response.json();
   if(!response.ok)throw Error(payload.error||"Search unavailable");
   matches=(payload.ac||[]).filter(a=>a.hex&&Number.isFinite(Number(a.lat))&&Number.isFinite(Number(a.lon)));
   if(matches.length){source=payload.source||"internet";resolved=candidate;break}
  }
  if(!matches.length){searchError="No currently reporting aircraft found for "+query+(queries.length>1?" (also tried "+queries[0]+")":"");updateSearchStatus();return}
  const match=matches[0];remoteAircraft=match;remoteFoundAt=Date.now();

  homeMode=false;sel=match.hex;follow=false;trailOn=true;
   lookupAirports(match);
  searchError="Found "+nm(match)+" via "+source+(resolved!==query?" ("+query+" → "+resolved+")":"")+" — loading filed route and flown path…";
  const t=trails[match.hex]||(trails[match.hex]=[]);t.push([match.lat,match.lon]);
  map.flyTo([match.lat,match.lon],12,{duration:1});

  lookupRoute(match,true).then(()=>{if(sel===match.hex){searchError="Found "+nm(match)+" via "+source+". Tap Follow to keep it centered.";draw();updateSearchStatus()}});
 }catch(e){searchError="Flight search unavailable: "+e.message}
 finally{searchBusy=false;updateSearchStatus()}
}

const cvTxt={CLR:"Clear",SKC:"Clear",FEW:"Mostly Clear",SCT:"Partly Cloudy",BKN:"Mostly Cloudy",OVC:"Overcast"},cvIc={CLR:"☀️",SKC:"☀️",FEW:"🌤",SCT:"⛅",BKN:"🌥",OVC:"☁️"};
const F=c=>Math.round(c*9/5+32);
const metarUrl=ids=>"/api/metar?format=json&ids="+ids;
function catOf(m){
 const reported=String(m.fltCat||"").toUpperCase();if(CC[reported]&&reported!=="NA")return reported;
 const v=parseFloat(String(m.visib??"").replace("+",""));
 const ceilings=(m.clouds||[]).filter(c=>["BKN","OVC","VV"].includes(c.cover)&&Number.isFinite(Number(c.base))).map(c=>Number(c.base));
 const c=ceilings.length?Math.min(...ceilings):Infinity;
 if(!Number.isFinite(v)&&!Number.isFinite(c))return"NA";
 if((Number.isFinite(v)&&v<1)||c<500)return"LIFR";
 if((Number.isFinite(v)&&v<3)||c<1000)return"IFR";
 if((Number.isFinite(v)&&v<=5)||c<=3000)return"MVFR";
 return"VFR";
}

    result={src:"Open-Meteo model data (METAR unavailable)",id:chosen.id,name:chosen.n,temp:Math.round(c.temperature_2m),dew:null,wind:Math.round(c.wind_direction_10m)+"° @ "+Math.round(c.wind_speed_10m)+" kt",wdir:Math.round(c.wind_direction_10m),wspd:Math.round(c.wind_speed_10m),vis:Math.min(10,Math.round(c.visibility/1609.34)),alt:(c.pressure_msl*0.02953).toFixed(2),clouds:cc+"% cover",raw:"",cond:cvTxt[k],icon:cvIc[k]};
   }catch(e2){
    result={src:"Weather unavailable",id:chosen.id,name:chosen.n,temp:"—",dew:null,wind:"—",vis:"—",alt:"—",clouds:"Weather unavailable",raw:"",cond:"Unavailable",icon:"",time:""};
   }
  }
 }
 if(request!==weatherRequest)return;
 wx=result;
 wx.dist=chosen.d.toFixed(1);
 $("loc").textContent=wx.id;
 $("locn").textContent=chosen.n+" • "+wx.dist+" NM"+(selected?" • Selected":"");
 $("tmp").textContent=wx.temp+"°F";$("cnd").textContent=(wx.icon?wx.icon+" ":"")+wx.cond;
 $("wnd").textContent="Wind "+wx.wind;$("vis").textContent="Vis "+wx.vis+" SM • Alt "+wx.alt+" inHg";
 $("wx").innerHTML=`<b>${esc(wx.id)}</b> (${wx.dist} NM) ${wx.icon} ${wx.temp}°F • ${esc(wx.wind)} • ${esc(wx.vis)} SM • ${esc(wx.alt)}<br><span class="mu">${esc(wx.clouds||"")}${wx.time?" • "+esc(wx.time):""}</span>`;
 if(view==="weather")renderView();
}

// ---------- GPS, clock, status ----------
async function loadTz(){try{const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${me.lat}&longitude=${me.lon}&current=temperature_2m&timezone=auto`)).json();new Intl.DateTimeFormat([],{timeZone:j.timezone});tz=j.timezone;tick()}catch(e){}}
let gw=null,first=true;
function setMe(la,lo,gps){me={lat:la,lon:lo,gps};drawHome();if(homeMode)map.setView([la,lo],map.getZoom());if(!trafficAirport)load();loadWx();loadTz();$("sG").className=gps?"ok":"mu";$("sG").textContent=gps?"Fix":"Manual"}
if(navigator.geolocation&&cfg.lat==null){
 gw=navigator.geolocation.watchPosition(p=>{
  const moved=dist(me.lat,me.lon,p.coords.latitude,p.coords.longitude)>0.5;
  $("sG").className="ok";$("sG").textContent=`Fix ±${Math.round(p.coords.accuracy)} m`;
  if(first||moved){first=false;setMe(p.coords.latitude,p.coords.longitude,true);$("sG").textContent=`Fix ±${Math.round(p.coords.accuracy)} m`}
 },e=>{$("sG").className="bad";$("sG").textContent="No fix — using KLCI"},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}else $("sG").textContent=cfg.lat!=null?"Manual":"Unsupported";
const tick=()=>{const d=new Date();$("clk").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",timeZoneName:"short",timeZone:tz});$("dt").textContent=d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric",year:"numeric",timeZone:tz});
 $("sI").className=navigator.onLine?"ok":"bad";$("sI").textContent=navigator.onLine?"Connected":"Offline"};
tick();setInterval(tick,1000);
renderSel();renderView();load();loadWx();loadTz();sched();loadCats();setInterval(()=>{loadWx();loadCats()},600000);
</script></body></html>
