<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>Flight Display</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}body{margin:0;background:#06101c;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#app{height:100dvh;display:grid;grid-template-rows:62px 1fr 68px}header{display:flex;align-items:center;padding:8px 14px;background:#071525;border-bottom:1px solid #29435f}.brand{font-weight:850;letter-spacing:.06em}.muted{color:#9bb1c8;font-size:12px}.status{margin-left:auto;display:flex;gap:7px}.pill{background:#10243a;border:1px solid #29435f;border-radius:99px;padding:7px 9px;font-size:11px}.ok{color:#5cff8a}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}#map{height:100%}.aviation-tools{position:absolute;right:12px;top:12px;z-index:4}.aviation-tools button{padding:9px 12px;background:#071525eb;border:1px solid #6a9fcd;font-size:12px}.airport-pin{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}.airport-pin .symbol{background:#8795a6;border:2px solid #fff9;border-radius:50%;width:19px;height:19px;display:block;box-shadow:0 0 9px #0008}.airport-pin .symbol.vfr{background:#22c55e}.airport-pin .symbol.mvfr{background:#3b82f6}.airport-pin .symbol.ifr{background:#ec4899}.airport-pin .symbol.lifr{background:#a855f7}.airport-pin .ident{font-size:11px;font-weight:800;color:white;background:#071525e8;padding:2px 5px;border-radius:4px}.aviation-off .airport-pin{display:none}.side{background:#081523;border-left:1px solid #29435f;overflow:auto;padding:11px}.card{background:#0d2034;border:1px solid #29435f;border-radius:13px;padding:12px;margin-bottom:9px}.big{font-size:24px;font-weight:850}.row{display:flex;justify-content:space-between;margin-top:7px}.search{width:100%;padding:11px;border-radius:9px;border:1px solid #365674;background:#071525;color:white;font-size:16px}.plane{font-size:24px;cursor:pointer;filter:drop-shadow(0 1px 2px #000)}.notice{position:absolute;z-index:3;left:12px;top:12px;background:#071525df;border:1px solid #365674;padding:8px 11px;border-radius:9px;font-size:12px}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:7px;background:#071525;border-top:1px solid #29435f}button{color:#eef6ff;background:#0d2034;border:1px solid #365674;border-radius:11px;font-weight:750}button.active{background:#087cf0}@media(max-width:800px){#app{grid-template-rows:56px 1fr 60px}main{grid-template-columns:1fr}.side{position:absolute;right:7px;top:67px;width:min(300px,76vw);max-height:48vh;z-index:5;border-radius:13px;background:#081523ef}.optional{display:none}nav button{font-size:10px}}</style></head>
<body><div id="app"><header><div><div class="brand">FLIGHT DISPLAY</div><div class="muted" id="clock"></div></div><div class="status"><span class="pill ok">● INTERNET</span><span class="pill" id="trafficStatus">TRAFFIC: connecting…</span><span class="pill optional">WEATHER READY</span></div></header><main><section style="position:relative"><div id="map"></div><div class="aviation-tools"><button id="airportToggle" type="button" aria-pressed="true">✈ Airports ON</button></div><div class="notice" id="diag">BUILD V2.12 • MAP: starting • TRAFFIC: waiting</div></section><aside class="side"><div class="card"><div class="muted">SELECTED AIRCRAFT</div><div class="big" id="callsign">—</div><div class="row"><span>Altitude</span><b id="alt">—</b></div><div class="row"><span>Ground speed</span><b id="spd">—</b></div><div class="row"><span>Heading</span><b id="hdg">—</b></div><div class="row"><span>ICAO24</span><b id="icao">—</b></div></div><div class="card"><div class="muted">SEARCH VISIBLE TRAFFIC</div><input class="search" id="search" placeholder="DAL123 or N123AB"><div id="results" class="muted" style="margin-top:9px"></div></div><div class="card"><div class="muted">DATA DESIGN</div><div style="margin-top:6px">Internet aircraft first. Local Raspberry Pi ADS-B will become the preferred source later.</div></div></aside></main><nav><button class="active">✈ Traffic</button><button onclick="document.getElementById('search').focus()">⌕ Search</button><button onclick="showPanel('airports')">▥ Airports</button><button onclick="showPanel('weather')">☁ Weather</button><button onclick="showPanel('settings')">⚙ Settings</button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script>
const E=id=>document.getElementById(id);const D=(m)=>{if(E('diag'))E('diag').textContent='BUILD V2.12 • '+m};window.addEventListener('error',e=>D('JS ERROR: '+e.message));D('MAP ENGINE: loaded • TRAFFIC: waiting');const map=new maplibregl.Map({container:'map',center:[-71.46,43.57],zoom:7.2,style:'https://tiles.openfreemap.org/styles/liberty'});map.addControl(new maplibregl.NavigationControl(),'top-left');map.on('load',()=>D('MAP: loaded • TRAFFIC: requesting'));map.on('error',e=>D('MAP ERROR: '+(e.error?.message||'tile/style failed')));let markers=[],aircraft=[];const airports=[['KLCI',-71.4189,43.5727],['KCON',-71.5023,43.2027],['KMHT',-71.4357,42.9326],['KASH',-71.5148,42.7817],['KPSM',-70.8233,43.0779],['KLEB',-72.3042,43.6261]];let airportsVisible=true;const airportDots={};function addAirportPins(){airports.forEach(([id,lon,lat])=>{const e=document.createElement('div');e.className='airport-pin';e.innerHTML='<span class="symbol" title="Weather unavailable"></span><span class="ident">'+id+'</span>';airportDots[id]=e.querySelector('.symbol');new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat([lon,lat]).addTo(map)});loadAirportWeather()}async function loadAirportWeather(){try{const r=await fetch('/api/weather?ids='+airports.map(a=>a[0]).join(','));if(!r.ok)throw Error(String(r.status));const data=await r.json();if(!Array.isArray(data))return;for(const m of data){const id=(m.icaoId||m.stationId||'').toUpperCase(),dot=airportDots[id];if(!dot)continue;const category=String(m.fltCat||m.flightCategory||'').toUpperCase();dot.className='symbol'+({VFR:' vfr',MVFR:' mvfr',IFR:' ifr',LIFR:' lifr'}[category]||'');dot.title=id+' • '+(category||'Weather unavailable')}}catch(e){console.warn('Airport weather unavailable',e)}}E('airportToggle').addEventListener('click',()=>{airportsVisible=!airportsVisible;E('airportToggle').textContent=airportsVisible?'● Weather ON':'● Weather OFF';E('airportToggle').setAttribute('aria-pressed',String(airportsVisible));E('map').classList.toggle('aviation-off',!airportsVisible)});E('airportToggle').textContent='● Weather ON';map.on('load',addAirportPins);setInterval(loadAirportWeather,300000);
function select(a){E('callsign').textContent=(a[1]||'UNKNOWN').trim()||'UNKNOWN';E('icao').textContent=a[0]||'—';E('alt').textContent=a[7]!=null?Math.round(a[7]*3.28084).toLocaleString()+' ft':'—';E('spd').textContent=a[9]!=null?Math.round(a[9]*1.94384)+' kt':'—';E('hdg').textContent=a[10]!=null?Math.round(a[10])+'°':'—'}
function render(d){markers.forEach(m=>m.remove());markers=[];aircraft=(d.states||[]).filter(a=>a[5]!=null&&a[6]!=null);aircraft.forEach(a=>{let e=document.createElement('div');e.className='plane';e.textContent='✈';e.style.transform='rotate('+(a[10]||0)+'deg)';e.style.color=a[8]?'#ffb02e':'#50e6ff';e.onclick=()=>select(a);markers.push(new maplibregl.Marker({element:e}).setLngLat([a[5],a[6]]).addTo(map))});E('trafficStatus').textContent='TRAFFIC: '+aircraft.length+' visible';doSearch()}
async function loadTraffic(){try{D('MAP: '+(map.loaded()?'loaded':'loading')+' • TRAFFIC: direct ADSB.fi');let b=map.getBounds(),lat=(b.getSouth()+b.getNorth())/2,lon=(b.getWest()+b.getEast())/2,u='https://opendata.adsb.fi/api/v3/lat/'+lat+'/lon/'+lon+'/dist/100',x=await fetch(u,{headers:{'Accept':'application/json'}});if(!x.ok)throw Error('direct HTTP '+x.status);let raw=await x.json(),ac=raw.ac||raw.aircraft||[],states=ac.filter(a=>a.lat!=null&&a.lon!=null).map(a=>[a.hex||'',a.flight||a.r||'',null,null,null,a.lon,a.lat,typeof a.alt_baro==='number'?a.alt_baro/3.28084:null,a.alt_baro==='ground',typeof a.gs==='number'?a.gs/1.94384:null,a.track||0,null,null,null,null,null,null]),d={states:states,source:'adsb.fi-direct'};render(d);D('MAP: '+(map.loaded()?'loaded':'loading')+' • TRAFFIC: '+states.length+' aircraft • DIRECT');E('trafficStatus').textContent='TRAFFIC: '+states.length+' LIVE';E('trafficStatus').style.color='#7dff8a'}catch(e){D('TRAFFIC ERROR: DIRECT/CORS • '+e.message);E('trafficStatus').textContent='TRAFFIC: direct fetch failed';E('trafficStatus').style.color='#ffb02e'}}
function doSearch(){let q=E('search').value.trim().toUpperCase(),f=aircraft.filter(a=>(a[1]||'').trim().toUpperCase().includes(q)||a[0].toUpperCase().includes(q)).slice(0,8);E('results').innerHTML=q?(f.length?f.map((a,i)=>'<div data-i="'+i+'" style="padding:8px;border-bottom:1px solid #29435f"><b>'+((a[1]||'UNKNOWN').trim())+'</b> • '+a[0]+'</div>').join(''):'No visible match'):(aircraft.length+' aircraft loaded');[...E('results').children].forEach((x,i)=>x.onclick=()=>{select(f[i]);map.flyTo({center:[f[i][5],f[i][6]],zoom:9})})}
E('search').addEventListener('input',doSearch);map.on('load',loadTraffic);map.on('moveend',loadTraffic);setInterval(loadTraffic,15000);setInterval(()=>E('clock').textContent=new Date().toLocaleString(),1000);async function showPanel(which){if(which==='airports'){E('callsign').textContent='AIRPORTS';E('icao').textContent='KLCI';E('alt').textContent='Laconia, NH';E('spd').textContent='Nearby: KCON';E('hdg').textContent='Tap Weather for METAR';}if(which==='weather'){E('callsign').textContent='KLCI WEATHER';try{let r=await fetch('/api/weather?ids=KLCI');let d=await r.json();let m=Array.isArray(d)?d[0]:null;E('icao').textContent=m?.rawOb||'Weather unavailable';E('alt').textContent=m?.temp!=null?m.temp+'°C':'—';E('spd').textContent=m?.wspd!=null?m.wspd+' kt':'—';E('hdg').textContent=m?.wdir!=null?m.wdir+'°':'—';}catch(e){E('icao').textContent='Weather unavailable'}}if(which==='settings'){E('callsign').textContent='SETTINGS';E('icao').textContent='Internet mode';E('alt').textContent='KLCI home area';E('spd').textContent='15 sec refresh';E('hdg').textContent='Pi ADS-B later';}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
