<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d18">
<title>Flight Display</title>
<style>.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden}.leaflet-tile{visibility:hidden;user-select:none}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-animated{transform-origin:0 0}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-map-pane svg{z-index:200}.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-right .leaflet-control{float:right}.leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#0a1628;color:#fff;text-decoration:none;border:1px solid #1b3556}.leaflet-control-attribution{background:#0008;color:#aaa;font-size:10px;padding:0 5px}.leaflet-control-attribution a{color:#8ab}.leaflet-marker-icon,.leaflet-interactive{cursor:pointer;pointer-events:auto}.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-fade-anim .leaflet-tile{transition:opacity .2s linear}</style>
<style>
:root{--bg:#050d18;--pn:#0a1628;--ln:#1b3556;--tx:#eaf2ff;--mu:#8ba3c4;--ac:#2b7fff;--ok:#34d399;--bad:#f87171;--com:#fbbf24;--ga:#4ade80;--mil:#f87171;--hel:#fb923c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:1fr minmax(340px,32%);grid-template-rows:64px 1fr 68px;gap:6px;padding:6px;padding-top:max(6px,env(safe-area-inset-top))}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px}
#top{grid-column:1/3;display:flex;align-items:center;overflow:hidden}
#top>div{padding:0 14px;border-right:1px solid var(--ln);height:100%;display:flex;flex-direction:column;justify-content:center;white-space:nowrap;line-height:1.25}
#top>div:last-child{border:0;margin-left:auto}
#top b{font-size:19px}.mu{color:var(--mu);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
#mapw{position:relative;overflow:hidden}#map{position:absolute;inset:0;background:#0a1626}
#sb{position:absolute;left:8px;top:8px;z-index:900;display:flex;flex-direction:column;gap:6px}
#sb button{width:62px;padding:8px 2px;font-size:11px;background:#0a1628e6;border:1px solid var(--ln);color:var(--tx);border-radius:8px}
#sb button i{display:block;font-style:normal;font-size:22px}#sb button.on{border-color:var(--ac);background:#12305c}
#wx{position:absolute;right:8px;top:8px;z-index:900;background:#0a1628e6;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;font-size:12px;max-width:60%}
#right{display:flex;flex-direction:column;gap:6px;min-height:0}
#sel{padding:10px 12px;flex:0 0 auto}#sel h2{margin:0;font-size:24px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:8px 0;font-size:13px}.g span{color:var(--mu)}.g b{float:right;color:var(--tx);font-weight:500}
.row{display:flex;gap:6px}.row button{flex:1}
button{font:inherit;color:var(--tx);background:#0f213b;border:1px solid var(--ln);border-radius:8px;padding:9px 6px}button.on{background:var(--ac);border-color:var(--ac)}
#view{flex:1;min-height:0;overflow:auto;padding:8px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:left;position:sticky;top:0;background:var(--pn)}
td,th{padding:6px 3px;border-bottom:1px solid #12243f}tr.r{cursor:pointer}tr.r.s{background:#12305c}
input,select{width:100%;padding:9px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font:inherit;margin:4px 0}
#nav{grid-column:1/3;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}#nav button{font-size:15px;border-radius:10px}#nav button i{font-style:normal;margin-right:6px}
.pl{position:relative}.pl svg{position:absolute;left:-15px;top:-15px;width:30px;height:30px;filter:drop-shadow(0 0 2px #000)}
.lb{position:absolute;left:16px;top:-16px;white-space:nowrap;font-size:12px;line-height:1.2;text-shadow:0 0 3px #000,0 0 3px #000;font-weight:600;background:#0008;padding:1px 4px;border-radius:4px}
.pl.s svg{filter:drop-shadow(0 0 6px #fff)}
.ap{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;text-shadow:0 0 3px #000;white-space:nowrap}.ap u{width:16px;height:16px;border-radius:50%;background:#1d4ed8;border:2px solid #fff;display:inline-block}
.rl{color:#fff;font-size:12px;font-weight:600;text-shadow:0 0 3px #000;white-space:nowrap}
.me{width:16px;height:16px;border-radius:50%;background:#38bdf8;border:3px solid #fff;margin:-8px 0 0 -8px;box-shadow:0 0 8px #38bdf8}
@media(max-aspect-ratio:1/1){#app{grid-template-columns:1fr;grid-template-rows:auto 55vh auto 1fr auto;overflow:auto}#top{grid-column:1;overflow-x:auto}#nav{grid-column:1;grid-template-columns:repeat(3,1fr)}html,body{overflow:auto}#app{height:auto}}
</style></head><body>
<div id="app">
<div id="top" class="box">
 <div><b id="clk">--:--</b><span class="mu" id="dt"></span></div>
 <div><b id="loc">—</b><span class="mu" id="locn">Locating…</span></div>
 <div><b id="tmp">—°F</b><span class="mu" id="cnd">Weather loading</span></div>
 <div><span class="mu" id="wnd">Wind —</span><span class="mu" id="vis">Vis — • Alt —</span></div>
 <div><b>ADS-B</b><span id="sA" class="bad">Connecting…</span></div>
 <div><b>Internet</b><span id="sI">—</span></div>
 <div><b>GPS</b><span id="sG">Searching…</span></div>
</div>
<div id="mapw" class="box"><div id="map"></div>
 <div id="sb"><button data-f="all" class="on"><i>☰</i>All</button><button data-f="com"><i>✈</i>Commercial</button><button data-f="ga"><i style="color:var(--ga)">✈</i>GA</button><button data-f="mil"><i style="color:var(--mil)">✈</i>Military</button><button data-f="heli"><i style="color:var(--hel)">✢</i>Helicopter</button></div>
 <div id="wx">Weather loading…</div></div>
<aside id="right"><div id="sel" class="box"></div><div id="view" class="box"></div></aside>
<nav id="nav"><button data-v="traffic" class="on"><i>✈</i>Traffic</button><button data-v="search"><i>⌕</i>Search Flight</button><button data-v="airports"><i>▥</i>Airports</button><button data-v="weather"><i>☁</i>Weather</button><button data-v="layers"><i>▱</i>Layers</button><button data-v="settings"><i>⚙</i>Settings</button></nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id), NM=1852, esc=s=>String(s).replace(/[<>&"]/g,"");
const SOURCES=[ // free, keyless, CORS-enabled ADS-B aggregators (tried in order)
 {n:"adsb.lol",u:(a,b,r)=>`https://api.adsb.lol/v2/point/${a}/${b}/${r}`},
 {n:"airplanes.live",u:(a,b,r)=>`https://api.airplanes.live/v2/point/${a}/${b}/${r}`}];
const AP=[["KLCI","Laconia",43.5727,-71.4189],["KCON","Concord",43.2027,-71.5023],["KMHT","Manchester",42.9326,-71.4357],["KASH","Nashua",42.7817,-71.5148],["KPSM","Portsmouth",43.0779,-70.8233],["KSFM","Sanford",43.3939,-70.7088],["KDAW","Rochester",43.2841,-71.0292],["KPWM","Portland",43.6462,-70.3093],["KBOS","Boston Logan",42.3643,-71.0052],["KBED","Hanscom",42.47,-71.289],["KORH","Worcester",42.2673,-71.8757],["KEEN","Keene",42.8984,-72.2708],["KLEB","Lebanon",43.6261,-72.3042]];
let cfg={poll:15,lat:null,lon:null,radar:true,rings:true,aps:true,nr:25};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("fdcfg")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("fdcfg",JSON.stringify(cfg))}catch(e){}};
let me={lat:cfg.lat??43.5727,lon:cfg.lon??-71.4189,gps:false}, data=[], filter="all", view="traffic", sel=null, follow=false, trailOn=false, src=0, wx=null, trails={}, mk={}, q="";
const rad=x=>x*Math.PI/180;
const dist=(a,b,c,d)=>{const p=rad(c-a),r=rad(d-b),x=Math.sin(p/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(r/2)**2;return 6371000*2*Math.asin(Math.sqrt(x))/NM};
const dme=a=>dist(me.lat,me.lon,a.lat,a.lon);
const kind=a=>(a.dbFlags||0)&1?"mil":a.category==="A7"?"heli":/^[A-Z]{3}\d/.test((a.flight||"").trim())?"com":"ga";
const COL={com:"#fbbf24",ga:"#4ade80",mil:"#f87171",heli:"#fb923c"};
const nm=a=>(a.flight||"").trim()||a.r||a.hex.toUpperCase();
const alt=a=>a.alt_baro==="ground"?"GND":typeof a.alt_baro==="number"?a.alt_baro.toLocaleString():"—";
const vis=a=>filter==="all"||kind(a)===filter;
const PLANE='<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>';

// ---------- map ----------
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView([me.lat,me.lon],10);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:18,attribution:'© OSM © CARTO • Aircraft: <a href="https://adsb.lol">adsb.lol</a> (ODbL) / <a href="https://airplanes.live">airplanes.live</a> • Not for navigation'}).addTo(map);
const radar=L.tileLayer.wms("https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows",{layers:"conus_bref_qcd",format:"image/png",transparent:true,opacity:.65});
const ringL=L.layerGroup(), apL=L.layerGroup(), acL=L.layerGroup().addTo(map), trL=L.layerGroup().addTo(map), meL=L.layerGroup().addTo(map);
function drawHome(){
 ringL.clearLayers();meL.clearLayers();
 [5,10,25].forEach(r=>{L.circle([me.lat,me.lon],{radius:r*NM,color:"#cfe3ff",weight:1.2,dashArray:"6 6",fill:false,opacity:.7}).addTo(ringL);
  L.marker([me.lat+r*NM/111320,me.lon],{interactive:false,icon:L.divIcon({className:"",html:`<div class="rl" style="transform:translate(-50%,-110%)">${r} NM</div>`})}).addTo(ringL)});
 L.marker([me.lat,me.lon],{interactive:false,icon:L.divIcon({className:"",html:'<div class="me"></div>'})}).addTo(meL);
}
function drawAps(){apL.clearLayers();AP.forEach(([id,n,la,lo])=>L.marker([la,lo],{icon:L.divIcon({className:"",html:`<div class="ap" style="transform:translate(-8px,-8px)"><u></u>${id}</div>`})}).on("click",()=>{map.setView([la,lo],11)}).addTo(apL))}
function layers(){const s=(l,on)=>on?l.addTo(map):map.removeLayer(l);s(ringL,cfg.rings);s(apL,cfg.aps);s(radar,cfg.radar)}
drawHome();drawAps();layers();

// ---------- traffic ----------
async function load(){
 for(let i=0;i<SOURCES.length;i++){
  const s=SOURCES[(src+i)%SOURCES.length];
  try{
   const r=await fetch(s.u(me.lat.toFixed(3),me.lon.toFixed(3),50),{cache:"no-store"});
   if(!r.ok)throw new Error(r.status);
   const j=await r.json();
   data=(j.ac||j.aircraft||[]).filter(a=>a.lat!=null&&a.lon!=null);
   src=(src+i)%SOURCES.length;
   data.forEach(a=>{const t=trails[a.hex]=trails[a.hex]||[],l=t[t.length-1];if(!l||l[0]!=a.lat||l[1]!=a.lon){t.push([a.lat,a.lon]);if(t.length>80)t.shift()}});
   $("sA").className="ok";$("sA").textContent=`Receiving (${s.n})`;
   return draw();
  }catch(e){console.warn(s.n,e)}
 }
 $("sA").className="bad";$("sA").textContent="No data — retrying";
}
let timer;const sched=()=>{clearInterval(timer);timer=setInterval(load,Math.max(10,cfg.poll)*1000)};
function draw(){
 const seen=new Set();
 data.filter(vis).forEach(a=>{
  seen.add(a.hex);const c=COL[kind(a)],s=a.hex===sel?" s":"";
  const icon=L.divIcon({className:"",iconSize:[0,0],html:`<div class="pl${s}"><svg viewBox="0 0 24 24" fill="${c}" stroke="#000" stroke-width=".6" style="transform:rotate(${a.track||0}deg)">${PLANE}</svg><div class="lb" style="color:${c}">${esc(nm(a))}<br>${alt(a)}${a.alt_baro==="ground"?"":" ft"}<br>${a.gs!=null?Math.round(a.gs)+" kt":""}</div></div>`});
  if(mk[a.hex])mk[a.hex].setLatLng([a.lat,a.lon]).setIcon(icon);else mk[a.hex]=L.marker([a.lat,a.lon],{icon}).addTo(acL).on("click",()=>pick(a.hex));
 });
 Object.keys(mk).forEach(h=>{if(!seen.has(h)){acL.removeLayer(mk[h]);delete mk[h]}});
 trL.clearLayers();
 const a=data.find(x=>x.hex===sel);
 if(a&&trailOn&&trails[sel])L.polyline(trails[sel],{color:"#38bdf8",weight:3}).addTo(trL);
 if(a&&follow)map.panTo([a.lat,a.lon]);
 renderSel();if(view==="traffic"||view==="search")renderView();
}
function pick(h){sel=h;const a=data.find(x=>x.hex===h);if(a)map.panTo([a.lat,a.lon]);draw()}
const card=a=>{const d=dme(a),b=(Math.atan2(Math.sin(rad(a.lon-me.lon))*Math.cos(rad(a.lat)),Math.cos(rad(me.lat))*Math.sin(rad(a.lat))-Math.sin(rad(me.lat))*Math.cos(rad(a.lat))*Math.cos(rad(a.lon-me.lon)))*180/Math.PI+360)%360;return[d,b]};
function renderSel(){
 const a=data.find(x=>x.hex===sel),el=$("sel");
 if(!a){el.innerHTML=`<h2>Select aircraft</h2><div class="mu">Tap a plane on the map or in the list${sel?" — selected aircraft is out of range":""}</div>`;return}
 const [d,b]=card(a),vr=a.baro_rate;
 el.innerHTML=`<h2><span style="color:${COL[kind(a)]}">★</span> ${esc(nm(a))}</h2><div class="mu">${esc(a.desc||a.t||"Unknown type")} ${a.r?"• "+esc(a.r):""}</div>
 <div class="g"><div><span>Altitude</span><b>${alt(a)} ft</b></div><div><span>Squawk</span><b>${esc(a.squawk||"—")}</b></div>
 <div><span>Ground speed</span><b>${a.gs!=null?Math.round(a.gs)+" kt":"—"}</b></div><div><span>Type</span><b>${esc(a.t||"—")}</b></div>
 <div><span>Heading</span><b>${a.track!=null?Math.round(a.track)+"°":"—"}</b></div><div><span>Registration</span><b>${esc(a.r||"—")}</b></div>
 <div><span>Distance</span><b>${d.toFixed(1)} NM @ ${Math.round(b)}°</b></div><div><span>Vert rate</span><b>${vr!=null?(vr>0?"+":"")+vr+" fpm":"—"}</b></div>
 <div><span>ICAO24</span><b>${a.hex.toUpperCase()}</b></div><div><span>Source</span><b class="ok">ADS-B</b></div></div>
 <div class="row"><button id="bF" class="${follow?"on":""}">⊕ Follow</button><button id="bR" class="${trailOn?"on":""}">☷ Show Route</button><button id="bM">ⓘ More Info</button></div>`;
 $("bF").onclick=()=>{follow=!follow;draw()};$("bR").onclick=()=>{trailOn=!trailOn;draw()};
 $("bM").onclick=()=>window.open("https://globe.adsb.lol/?icao="+a.hex,"_blank");
}

// ---------- right-panel views ----------
function rows(list){return list.map(a=>`<tr class="r${a.hex===sel?" s":""}" data-h="${a.hex}"><td style="color:${COL[kind(a)]}">${esc(nm(a))}</td><td>${esc(a.t||"—")}</td><td>${alt(a)}</td><td>${a.gs!=null?Math.round(a.gs):"—"}</td><td>${dme(a).toFixed(1)} NM</td></tr>`).join("")}
const head="<table><thead><tr><th>Callsign</th><th>Type</th><th>Alt</th><th>Spd</th><th>Dist</th></tr></thead><tbody>";
function renderView(){
 const v=$("view");
 if(view==="traffic"){
  const l=data.filter(vis).filter(a=>dme(a)<=cfg.nr).sort((a,b)=>dme(a)-dme(b));
  v.innerHTML=`<div class="row" style="align-items:center"><b style="flex:2">Nearby Aircraft (${l.length})</b><select id="nr" style="flex:1">${[5,10,25,50].map(n=>`<option ${n==cfg.nr?"selected":""} value="${n}">${n} NM</option>`).join("")}</select></div>${head}${rows(l)||'<tr><td colspan=5 class="mu">No aircraft in range</td></tr>'}</tbody></table>`;
  $("nr").onchange=e=>{cfg.nr=+e.target.value;save();renderView()};
 }else if(view==="search"){
  const t=q.toLowerCase(),l=t?data.filter(a=>[a.flight,a.r,a.hex,a.t].join(" ").toLowerCase().includes(t)).slice(0,50):[];
  v.innerHTML=`<input id="qi" placeholder="Callsign, tail number, ICAO24 or type" value="${esc(q)}">${t?head+rows(l)+"</tbody></table>":'<div class="mu">Searches all aircraft within 50 NM of you.</div>'}`;
  const i=$("qi");i.oninput=e=>{q=e.target.value;const p=i.selectionStart;renderView();$("qi").focus();$("qi").setSelectionRange(p,p)};
 }else if(view==="airports"){
  v.innerHTML="<b>Nearby airports</b><table><tbody>"+AP.map(([id,n,la,lo])=>[id,n,la,lo,dist(me.lat,me.lon,la,lo)]).sort((a,b)=>a[4]-b[4]).map(([id,n,la,lo,d])=>`<tr class="r" data-ap="${la},${lo}"><td><b>${id}</b></td><td>${n}</td><td>${d.toFixed(1)} NM</td></tr>`).join("")+"</tbody></table>";
 }else if(view==="weather"){
  v.innerHTML=wx?`<b>${esc(wx.id)} ${esc(wx.name||"")}</b><div class="mu">${esc(wx.src)}${wx.time?" • observed "+wx.time:""}</div>
  <div class="g" style="grid-template-columns:1fr"><div><span>Conditions</span><b>${wx.cond}</b></div><div><span>Temp / Dewpoint</span><b>${wx.temp}°F${wx.dew!=null?" / "+wx.dew+"°F":""}</b></div><div><span>Wind</span><b>${wx.wind}</b></div><div><span>Visibility</span><b>${wx.vis} SM</b></div><div><span>Altimeter</span><b>${wx.alt} inHg</b></div><div><span>Clouds</span><b>${esc(wx.clouds||"—")}</b></div></div>
  ${wx.raw?`<div class="mu">Raw METAR</div><code style="font-size:12px;word-break:break-word">${esc(wx.raw)}</code>`:""}
  <p class="mu">Voice ATIS/AWOS broadcasts are built from this same METAR data, which is the only free machine-readable form.</p>`:"Weather loading…";
 }else if(view==="layers"){
  v.innerHTML=[["radar","NOAA precipitation radar"],["rings","Distance rings (5/10/25 NM)"],["aps","Airports"]].map(([k,n])=>`<button style="width:100%;margin-bottom:6px" class="${cfg[k]?"on":""}" data-l="${k}">${n}: ${cfg[k]?"ON":"OFF"}</button>`).join("")+'<div class="mu">Radar is NOAA mosaic data, not for flight navigation.</div>';
 }else{
  v.innerHTML=`<b>Position</b><div class="mu">${me.gps?"Using live GPS":"GPS not available — using manual/default position"}</div>
  <input id="la" value="${me.lat.toFixed(4)}" inputmode="decimal"><input id="lo" value="${me.lon.toFixed(4)}" inputmode="decimal">
  <button id="ap" style="width:100%">Set position manually (disables GPS follow)</button>
  <p><b>Refresh interval (seconds, min 10)</b></p><input id="pl" type="number" min="10" value="${cfg.poll}"><button id="ps" style="width:100%">Save</button>`;
  $("ap").onclick=()=>{const la=parseFloat($("la").value),lo=parseFloat($("lo").value);if(isNaN(la)||isNaN(lo))return;cfg.lat=la;cfg.lon=lo;save();if(gw!=null){navigator.geolocation.clearWatch(gw);gw=null}setMe(la,lo,false)};
  $("ps").onclick=()=>{cfg.poll=Math.max(10,+$("pl").value||15);save();sched()};
 }
}
$("view").addEventListener("click",e=>{
 const r=e.target.closest("tr.r");if(r){if(r.dataset.h)pick(r.dataset.h);else if(r.dataset.ap)map.setView(r.dataset.ap.split(",").map(Number),11)}
 const b=e.target.closest("[data-l]");if(b){cfg[b.dataset.l]=!cfg[b.dataset.l];save();layers();renderView()}});
$("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));renderView()});
$("sb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#sb button").forEach(x=>x.classList.toggle("on",x===b));draw()});

// ---------- weather (METAR from nearest airport, Open-Meteo fallback) ----------
const cvTxt={CLR:"Clear",SKC:"Clear",FEW:"Mostly Clear",SCT:"Partly Cloudy",BKN:"Mostly Cloudy",OVC:"Overcast"},cvIc={CLR:"☀️",SKC:"☀️",FEW:"🌤",SCT:"⛅",BKN:"🌥",OVC:"☁️"};
const F=c=>Math.round(c*9/5+32);
async function loadWx(){
 const near=AP.map(a=>({id:a[0],n:a[1],d:dist(me.lat,me.lon,a[2],a[3])})).sort((a,b)=>a.d-b.d);
 $("loc").textContent=near[0].id;$("locn").textContent=near[0].n+", NH";
 try{

 }catch(e){

   const c=(await r.json()).current,cc=c.cloud_cover,k=cc<15?"CLR":cc<35?"FEW":cc<60?"SCT":cc<85?"BKN":"OVC";
   wx={src:"Open-Meteo model data (METAR unavailable)",id:near[0].id,name:near[0].n,temp:Math.round(c.temperature_2m),dew:null,wind:Math.round(c.wind_direction_10m)+"° @ "+Math.round(c.wind_speed_10m)+" kt",wdir:Math.round(c.wind_direction_10m),wspd:Math.round(c.wind_speed_10m),vis:Math.min(10,Math.round(c.visibility/1609.34)),alt:(c.pressure_msl*0.02953).toFixed(2),clouds:cc+"% cover",raw:"",cond:cvTxt[k],icon:cvIc[k]};
  }catch(e2){wx=null;$("cnd").textContent="Weather unavailable";return}
 }
 $("tmp").textContent=wx.temp+"°F";$("cnd").textContent=wx.icon+" "+wx.cond;

}
